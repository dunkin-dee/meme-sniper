[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-sniper"
version = "0.1.0"
description = "Pump.fun launch recorder and signal research platform"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "base58>=2.1",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
sniper = "sniper.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
