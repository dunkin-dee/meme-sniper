# Litestream: continuous replication of the SQLite WAL.
#
# CRITICAL: the replica bucket MUST NOT live in the same AWS account that runs
# this instance. A new-account AWS Free plan closes the account automatically
# 6 months after signup, and "access to current resources and data will be
# lost" - which would destroy the EC2 instance and a same-account S3 bucket in
# the same stroke. A backup that dies with the thing it is backing up is not a
# backup.
#
# Use Backblaze B2 or Cloudflare R2 (both S3-compatible, both have free/cheap
# tiers).
#
# Credentials come from /etc/meme-sniper/litestream.env:
#   LITESTREAM_ACCESS_KEY_ID=...
#   LITESTREAM_SECRET_ACCESS_KEY=...
#
# ---------------------------------------------------------------------------
# WRITTEN FOR LITESTREAM 0.5.x. Do not copy 0.3.x examples into this file.
#
# 0.5 moved retention/snapshot settings OUT of the replica block and up to a
# global `snapshot:` block, and replaced the `replicas:` array with a single
# `replica:`. Litestream IGNORES unrecognized keys instead of rejecting them -
# verified 2026-08-05 by feeding it `bogus-key-xyz: 42`, which parsed cleanly
# with exit 0. So a leftover `retention:` under the replica does not fail; it
# silently leaves you on the 24h default while the config still *reads* as
# though it keeps 30 days. Check `litestream --version` before trusting any
# example you find online.
# ---------------------------------------------------------------------------

# Global, NOT per-replica. Per-database `snapshot:` blocks are promoted to
# global anyway, and conflicting values fail at startup.
snapshot:
  # Full snapshot daily so a restore never replays a long chain of LTX files.
  interval: 24h

  # How far back point-in-time restore reaches. Each retained snapshot is a
  # full copy, so this multiplies stored bytes by roughly (retention/interval)
  # - here 7 copies. The database grows ~1.5-2.3 GB/month, so 30 days of daily
  # snapshots would blow through B2's 10 GB free tier within weeks. 7 days is
  # the compromise; raise it once you have measured real bucket growth.
  # Overage on B2 is ~$0.006/GB/month, so this is a free-tier limit, not a
  # cost limit.
  retention: 168h

dbs:
  - path: /opt/meme-sniper/data/sniper.db

    # Singular `replica` - 0.5 supports exactly one per database.
    replica:
      type: s3

      # --- Backblaze B2 ---
      bucket: CHANGE-ME-bucket-name
      path: meme-sniper/sniper.db
      endpoint: CHANGE-ME.backblazeb2.com   # match YOUR bucket's region
      region: CHANGE-ME
      force-path-style: true

      # --- Cloudflare R2 alternative ---
      # endpoint: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      # region: auto
      # force-path-style: true

      # Ship changes every 10s: worst-case loss is ~10 seconds of launches
      # rather than hours. Still a valid replica-level key in 0.5.
      sync-interval: 10s
