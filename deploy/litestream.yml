# Litestream: continuous replication of the SQLite WAL.
#
# CRITICAL: the replica bucket MUST NOT live in the same AWS account that runs
# this instance. A new-account AWS Free plan closes the account automatically
# 6 months after signup, and "access to current resources and data will be
# lost" - which would destroy the EC2 instance and a same-account S3 bucket in
# the same stroke. A backup that dies with the thing it is backing up is not a
# backup.
#
# Use Backblaze B2 or Cloudflare R2 (both S3-compatible, both have free/cheap
# tiers).
#
# Credentials come from /etc/meme-sniper/litestream.env:
#   LITESTREAM_ACCESS_KEY_ID=...
#   LITESTREAM_SECRET_ACCESS_KEY=...
#
# ---------------------------------------------------------------------------
# WRITTEN FOR LITESTREAM 0.5.x. Do not copy 0.3.x examples into this file.
#
# 0.5 moved retention/snapshot settings OUT of the replica block and up to a
# global `snapshot:` block, and replaced the `replicas:` array with a single
# `replica:`. Litestream IGNORES unrecognized keys instead of rejecting them -
# verified 2026-08-05 by feeding it `bogus-key-xyz: 42`, which parsed cleanly
# with exit 0. So a leftover `retention:` under the replica does not fail; it
# silently leaves you on the 24h default while the config still *reads* as
# though it keeps 30 days. Check `litestream --version` before trusting any
# example you find online.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Backblaze B2 free tier: 2,500 Class C (ListObjectsV2) transactions per DAY.
# Class A (PutObject) is unlimited, so shipping data is free - what costs is
# every periodic monitor that LISTS the bucket to decide what to do.
#
# Litestream 0.5's defaults assume a bucket with no such cap and blow through
# it several times over before a single sync:
#
#   l0-retention-check-interval  15s  -> 5,760/day
#   L1 compaction                30s  -> 2,880/day
#   L2 compaction                 5m  ->   288/day
#   sync-interval                10s  -> up to 8,640/day
#
# On 2026-08-06 this produced a hard failure, not a slowdown: B2 returned
# `403 AccessDenied: Transaction cap exceeded` and replication stopped
# entirely - compaction, L0 retention and sync all failing - while the service
# still showed `active`. Backups being silently down is the worst outcome
# here, so these intervals are deliberately far below the cap.
#
# Budget at the values below: ~1,440 (sync) + 144 (L1) + 24 (L2) + 4 (L3)
# + 96 (L0 retention) + 1 (snapshot) ~= 1,700/day, ~68% of cap.
#
# The alternative is to raise the cap on B2's Caps & Alerts page. Class C
# overage is $0.004/1,000, so even 10,000 extra transactions/day is ~$1.20 a
# month - cheap if a tighter loss window is ever worth more than free.
# ---------------------------------------------------------------------------

# Position sets the level: first entry is L1, second L2, third L3.
levels:
  - interval: 10m    # L1 (default 30s)
  - interval: 1h     # L2 (default 5m)
  - interval: 6h     # L3 (default 1h)

# L0 files are the raw per-transaction LTX stream. Keeping them longer and
# checking less often costs a little storage and saves a lot of LIST calls;
# the deletes themselves are Class A and free.
l0-retention: 30m
l0-retention-check-interval: 15m

# Global, NOT per-replica. Per-database `snapshot:` blocks are promoted to
# global anyway, and conflicting values fail at startup.
snapshot:
  # Full snapshot daily so a restore never replays a long chain of LTX files.
  interval: 24h

  # How far back point-in-time restore reaches. Each retained snapshot is a
  # full copy, so this multiplies stored bytes by roughly (retention/interval)
  # - here 7 copies. The database grows ~1.5-2.3 GB/month, so 30 days of daily
  # snapshots would blow through B2's 10 GB free tier within weeks. 7 days is
  # the compromise; raise it once you have measured real bucket growth.
  # Overage on B2 is ~$0.006/GB/month, so this is a free-tier limit, not a
  # cost limit.
  retention: 168h

dbs:
  - path: /opt/meme-sniper/data/sniper.db

    # Singular `replica` - 0.5 supports exactly one per database.
    replica:
      type: s3

      # --- Backblaze B2 ---
      bucket: CHANGE-ME-bucket-name
      path: meme-sniper/sniper.db
      endpoint: CHANGE-ME.backblazeb2.com   # match YOUR bucket's region
      region: CHANGE-ME
      force-path-style: true

      # --- Cloudflare R2 alternative ---
      # endpoint: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      # region: auto
      # force-path-style: true

      # Backblaze B2's free tier allows 2,500 Class B (GetObject/HeadObject)
      # and 2,500 Class C (ListObjectsV2) transactions per DAY. Class A
      # (PutObject) is unlimited, so the LTX uploads themselves are free - what
      # costs is the list/head each sync cycle performs to work out what to
      # ship. At the original 10s this was 8,640 cycles/day, ~3.5x over cap.
      #
      # 60s => 1,440 cycles/day, leaving headroom for snapshot, retention and
      # compaction traffic. The cost is the worst-case loss window: up to ~60s
      # of launches (~25 at current rates) instead of ~10s, and only if the
      # instance dies outright rather than merely restarting - Litestream
      # resumes from the local WAL across a normal restart. The daily
      # pull-data.ps1 snapshot is the second line.
      #
      # Verify against B2's Caps & Alerts page after a full day; if Class C is
      # still near the cap, raise this further rather than paying per request.
      sync-interval: 60s
